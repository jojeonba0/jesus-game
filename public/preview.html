<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>예수님 게임 미리보기</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
  /* 레이아웃: 위 조작줄 + (넓은 화면) 왼쪽 운영자 화면, 오른쪽 참가자 휴대폰들 / (좁은 화면) 탭으로 하나씩 */
  :root {
    --bg: #eef0f4; --surface: #ffffff; --line: #d9dde6; --fg: #1d2230; --muted: #646c80;
    --accent: #a8780c; --accent-ink: #ffffff; --night: #171c2e;
    --font: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #0d1019; --surface: #161a26; --line: #2a3042; --fg: #e5e8f0; --muted: #959cb0; --accent: #e0b04a; --accent-ink: #1a1405; --night: #0a0d16; color-scheme: dark; }
  }
  :root[data-theme="dark"] { --bg: #0d1019; --surface: #161a26; --line: #2a3042; --fg: #e5e8f0; --muted: #959cb0; --accent: #e0b04a; --accent-ink: #1a1405; --night: #0a0d16; color-scheme: dark; }

  html, body { height: 100%; }
  body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 14px; }
  .shell { display: flex; flex-direction: column; height: 100%; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px; gap: 12px; box-sizing: border-box; }
  .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; }
  .bar h1 { font-size: 1.1rem; margin: 0; font-weight: 700; text-wrap: balance; }
  .bar .hint { color: var(--muted); flex: 1 1 260px; min-width: 0; line-height: 1.45; }
  .controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .controls label { color: var(--muted); }
  select, button { font: inherit; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
  button { cursor: pointer; }
  button.go { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; }
  button:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .tabs { display: none; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
  .tabs button { white-space: nowrap; flex: none; }
  .tabs button[aria-selected="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }

  .stage { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 14px; }
  .players { min-height: 0; overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; align-content: start; padding-right: 2px; }
  .pane { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .pane header { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 7px 12px; border-bottom: 1px solid var(--line); font-weight: 700; }
  .pane header .role { font-weight: 500; font-size: .82rem; color: var(--muted); }
  .pane iframe { border: 0; width: 100%; flex: 1; min-height: 0; background: var(--bg); }
  .pane.admin iframe { height: 100%; }
  .players { grid-auto-rows: max-content; }
  .pane.player { min-height: auto; }
  .pane.player iframe { height: 640px; flex: none; }
  .pane.admin header { background: var(--night); color: #f1e3bf; border-bottom-color: var(--night); }

  @media (max-width: 1000px) {
    .tabs { display: flex; }
    .stage { display: block; position: relative; }
    .players { display: contents; }
    .pane, .pane.player { display: none; height: 100%; min-height: 0; }
    .pane.active { display: flex; }
    .pane.player iframe { height: auto; flex: 1; }
  }
  @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>
</head>
<body>
<div class="shell">
  <div class="bar">
    <h1>예수님 게임 미리보기</h1>
    <div class="hint" id="hint">운영자 1명과 참가자들이 이 한 화면 안에서 실제로 게임을 해요. 운영자 화면에서 역할을 정하고 시작해 보세요. 참가자 화면에서 밤 채팅도 직접 쳐볼 수 있어요.</div>
    <div class="controls">
      <label for="count">참가자</label>
      <select id="count"></select>
      <button class="go" id="restart">새로 시작</button>
    </div>
  </div>
  <div class="tabs" id="tabs" role="tablist"></div>
  <div class="stage" id="stage">
    <section class="pane admin active" data-id="admin">
      <header><span>🎩 운영자</span><span class="role" id="roomLabel" style="color:#d9c48f"></span></header>
      <iframe id="adminFrame" title="운영자 화면"></iframe>
    </section>
    <div class="players" id="players"></div>
  </div>
</div>

<script src="engine.js"></script>
<script>
  const NAMES = ['베드로', '요한', '야고보', '안드레', '빌립', '도마', '마태', '시몬', '다대오', '바돌로매'];
  const ROLE_LABEL = { jesus: '✝️ 예수님', disciple: '🕊️ 제자', pharisee: '📜 바리새인', traitor: '🪙 배신자' };
  const el = id => document.getElementById(id);
  let handle, roomCode, frames, active = 'admin', session = 0;

  for (let n = 3; n <= NAMES.length; n++) el('count').insertAdjacentHTML('beforeend', `<option value="${n}" ${n === 6 ? 'selected' : ''}>${n}명</option>`);

  function setActive(id) {
    active = id;
    document.querySelectorAll('.pane').forEach(p => p.classList.toggle('active', p.dataset.id === id));
    document.querySelectorAll('#tabs button').forEach(b => b.setAttribute('aria-selected', b.dataset.id === id));
  }

  function start() {
    session++;
    handle = JesusGame.createHandler(JesusGame.memoryStore());
    roomCode = null;
    const n = +el('count').value;
    const names = NAMES.slice(0, n);
    el('roomLabel').textContent = '';
    el('players').innerHTML = names.map((nm, i) => `
      <section class="pane player" data-id="p${i}">
        <header><span>📱 ${nm}</span><span class="role" id="role${i}">입장 대기</span></header>
        <iframe id="pf${i}" title="${nm}의 휴대폰"></iframe>
      </section>`).join('');
    el('tabs').innerHTML = `<button data-id="admin" role="tab">🎩 운영자</button>` + names.map((nm, i) => `<button data-id="p${i}" role="tab">${nm}</button>`).join('');
    el('tabs').querySelectorAll('button').forEach(b => b.onclick = () => setActive(b.dataset.id));
    frames = { admin: el('adminFrame') };
    names.forEach((_, i) => { frames['p' + i] = el('pf' + i); });
    el('adminFrame').src = 'admin.html?demo=1&autocreate=1&s=' + session;
    setActive('admin');
    frames.names = names;
  }

  function joinPlayers() {
    frames.names.forEach((nm, i) => {
      el('pf' + i).src = `play.html?demo=1&room=${roomCode}&autoname=${encodeURIComponent(nm)}&s=${session}`;
    });
  }

  window.addEventListener('message', async e => {
    const d = e.data;
    if (!d || !d.jgReq || !e.source) return;
    const mySession = session;
    const out = await handle(d.msg);
    if (mySession !== session) return;
    for (const m of out) {
      if (m.t === 'created') { roomCode = m.code; el('roomLabel').textContent = `방 ${m.code}`; joinPlayers(); }
      if (m.t === 'state' && m.as === 'player') {
        const i = frames.names.indexOf(m.me.name);
        if (i >= 0) el('role' + i).textContent = m.me.role ? `${ROLE_LABEL[m.me.role]}${m.me.alive ? '' : ' · 제외됨'}` : '대기실';
      }
    }
    e.source.postMessage({ jgRes: true, id: d.id, out }, '*');
  });

  el('restart').onclick = start;
  start();
</script>
</body>
</html>
